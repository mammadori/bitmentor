# An example GitLab CI for bitmentor: copy it to .gitlab-ci.yml in your own repository.
# Every branch: the site and Caddy images, the tests, a valid Caddyfile in the three modes.
# Every tag: the same, then the two images named after the tag in this project's container registry.
#
# Optional project variable (Settings > CI/CD > Variables):
#   FORBIDDEN_NAMES  a regular expression of names that must not appear in the software, for example your community's
variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

.docker:
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - export VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - docker build --build-arg VERSION=$VERSION -t site .
    - docker build -f Dockerfile.caddy --build-arg VERSION=$VERSION -t caddy .
    - docker run --rm -e COMMUNITY_DIR=/app/examples/community -e SECRET_KEY=test -e FORBIDDEN_NAMES site python manage.py test
    - |
      for mode in development maintenance production; do
        docker run --rm -e SITE_MODE=$mode -e SITE_HOST=example.org caddy \
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      done

test:
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - echo "images $VERSION tested"

release:
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag site $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker tag caddy $CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_TAG
    - docker push -q $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push -q $CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_TAG

docs:
  image: python:3.14-slim
  script:
    - python3 deploy/tests/test_documents.py
