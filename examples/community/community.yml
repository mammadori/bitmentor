# Everything that sets one community apart from the others is in this folder: the software need not be touched.
name: Example community
# The place: pages read it as {{ community.city }}
city: Example
email: info@example.org
logo: logo.svg
theme_color: "#224455"
theme_color_dark: "#10181c"
timezone: Europe/Rome
# The register's currency
currency: EUR
# The register. All optional (`confirm_above` and `explorers` are read only with on-chain turned on: `experimental` below,
# docs/features/onchain.md):
# - `price_sources`: the public sources of the exchange rate, two of which must agree (kraken, coinbase, bitstamp, mempool,
#   coingecko, blockchain); `tolerance` in % (1, at most 20) and `max_rate_age` in minutes (120); `manage.py check` warns
#   about a value it cannot use (`shops.W008`).
# - `discount`: the discount for paying in bitcoin, in %, that the register suggests to a shop that has none (0).
# - `confirm_above`: an on-chain sale above this amount, in the currency, waits for a confirmation; 0 (the default) is
#   every sale. Each merchant changes it on the phone.
# - `explorers`: where the register sees on-chain payments: mempool.space's API or an instance of it, one list or one
#   per network. Only these hosts are opened in the register's CSP. Without it, mempool.space.
# - `relays`: the community's Nostr relays (wss://), where every register keeps its encrypted copy and the staff registers
#   send their sales to the owner (docs/features/nostr-copies.md, with what the relay must limit). Without it, no copy on
#   Nostr. `public_relays`: public relays an owner may add on the phone. Only these hosts are opened in the CSP.
# register:
#   discount: 10
#   confirm_above: 0
#   explorers:
#     mainnet: [https://mempool.space/api]
#     signet: [https://mempool.space/signet/api]
#   relays: [wss://relay.example.org]
#   public_relays: [wss://nos.lol, wss://relay.damus.io]
#   price_sources: [kraken, coinbase, mempool]
tagline:
  it: Dove pagare in bitcoin, vicino a casa.
  en: Where to pay in bitcoin, close to home.
# The preview image when someone shares a link to the site: 1200×630, JPEG or PNG, inside theme/.
# It can be one per language, {it: …, en: …}. A page picks another with `image:` in its metadata.
# share_image: /theme/preview.jpg
# The first language is the default. Each language needs its own folder in pages/
languages:
  en: English
  it: Italiano
# Where the shop map starts. zoom: 6 a country, 13 a city, 16 a street
map:
  latitude: 41.9
  longitude: 12.5
  zoom: 13
  # featured_city: Example   # optional: the home page features only the shops of this town
menu:
  - slug: map
    path: shops/map/
    labels: {it: Mappa, en: Map}
  - slug: about
    labels: {it: Chi siamo, en: About}
# Pages other sites may show in a frame (an <iframe>), by slug, with shell patterns: a game, a lesson. Only public pages of the
# community; the panel and the registers never. `embed_from`: only these https sites (every site when missing).
# embeddable: [game-*]
# embed_from: [https://blog.example.org]
footer_menu:
  - slug: contact
    labels: {it: Contatti, en: Contacts}
  - slug: privacy
    labels: {it: Privacy, en: Privacy}
# The community's profiles: links in the footer and, in the home page's structured data, `sameAs` for search engines
# links:
#   - label: Mastodon
#     url: https://mastodon.example/@example
# Donations to the association, shown on the home page with a QR code each: a label and what the code holds.
# donations:
#   Lightning: donate@example.org
# A read-only Blossom server for the theme's files (docs/features/blossom.md).
# blossom: true
# Optional features (docs/features/README.md, "Turning features off"): all on unless you write `false`. Off, a feature leaves
# the merchant's panel, the public pages, the messages and the commands, its addresses answer 404, and nothing is deleted:
# turned on again, everything is back. The names are these three; `manage.py check` warns about anything else.
# features:
#   certified: false        # the badge of certified shops: on the map and the shop page, `certified` in /shops.json, the private part of
#                           # the pages for their owners, the certificate in the merchant's path and /admin/. The icons of
#                           # how recently the Lightning address worked stay
#   vacation: false         # shops closed for a while: the card and pages, "Closed for holidays · back on…" on the map and the page,
#                           # `break` in /shops.json and Nostr, the welcome back. A closure running with a day to open again still
#                           # keeps the alarms quiet until that day (at most 92 days), and /admin/ keeps the Closures table
#   practice: false         # the practice register: the buttons, the links and the two addresses
# Experimental features (docs/features/README.md, "Experimental features"): all off unless you write `true`. They work and are
# tested, but had less review and less real use, and may change or go: not what a community starts with. Off, one is as quiet
# as a feature turned off, and nothing is deleted. The names are these two; `manage.py check` warns about anything else.
# experimental:
#   onchain: true           # on-chain payments at the register, for special cases (docs/features/onchain.md)
#   osm_upload: true        # `manage.py osm_upload`, which writes to OpenStreetMap (docs/features/openstreetmap.md)
# Certified shops (docs/features/certified-shops.md): a shop whose Lightning address works and whose owner has the basic pass of
# the training. Nothing to set here.
# The merchant's training, the «pass» (docs/features/merchant-training.md). Off unless this
# block exists. A path of modules the community writes: for each one an `id` (letters, digits and dashes), a `title`, the
# `page` to read (a page of the site, as in `shop_page`), 2 to 4 `questions` (`text`, `options`, `answer` = the number of the
# right option, from 1, `explain` = the line that explains) and the `declarations` the merchant ticks (`id` and `text`, in
# the first person). Every text can be written for each language, and is at most 600 characters. Each declaration is kept
# as the written proof of the information: the hash of its text is its version, so a changed text is asked again.
# - `gate`: `unlock` (the real till, NETWORK=mainnet, opens with the basic pass) or `reminder` (only reminders).
# - `quick_start`: an amount in the community's currency (20; 0 or missing: off). Until the owner has the basic pass, the
#   owner's register takes payments up to this total, counted on the owner's phone; staff registers wait for the pass. Once
#   the total is reached, the register asks for the pass (`gate: unlock` only).
# - `since`: the day the training starts to count (2026-12-01). With `gate: unlock` on a real-money site, the register of an
#   owner without the basic pass is locked from that day, or at once when `since` is missing: a community that turns the
#   training on for shops that already sell writes a `since` ahead and tells its merchants first.
# - `review_months`: the short review comes every this many months (12); `refresh_days`: days after it is due before the
#   «Trained merchant» sign goes (30). Nothing is ever locked by a review or by a changed text.
# - `public_sign`: the «Trained merchant» sign on the shop page, the map and /shops.json; true by default. The certificate
#   of a shop always needs the basic pass.
# - `guides`: the pages of the three steps declared after a guide: `practice` (the practice register has its own page),
#   `backup` and `withdrawal`. `staff_rules`: the three rules of the counter, read at the first opening of a staff register
#   (the software has them in English when the key is missing).
