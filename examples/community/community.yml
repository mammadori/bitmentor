#
# How long the site keeps what it knows about a person (docs/features/help.md, "How long a request is kept"). A request for help
# that was solved `help_requests_days` ago loses the merchant's line, the copy of the diagnosis and the account, and stays as a row
# for the counts. A whole number from 30 to 3650; 0 or false: the timer never forgets (by hand, `manage.py forget_old_requests
# --days N` still can). This is the number the timer uses; without the block it is 365. The messages in the moderators' Telegram chat
# are not reached: turn on the automatic deletion of messages there. `email_prints_days` (32 to 3650, default 62): the prints of the
# recipients the email budget counts. These are defaults, not a law: set what fits your community; 0 or false keeps them for good.
# privacy:
#   help_requests_days: 365
#   email_prints_days: 62
# The stops appear where a page writes {% include "website/route.html" %}. You find the coordinates by clicking on openstreetmap.org
route:
  - name: {it: Il primo bar, en: The first bar}
    place: Example
    latitude: 41.9022
    longitude: 12.4970
    text:
      it: "Da riempire: chi c'è al banco, cosa si paga, da quando."
      en: "To fill in: who is behind the bar, what you can pay for, since when."
  - name: {it: Il negozio dove chiedere, en: The shop where you can ask}
    place: Example
    latitude: 41.8985
    longitude: 12.5030
    text:
      it: "Da riempire: chi risponde alle domande, e in quali giorni."
      en: "To fill in: who answers questions, and on which days."
  - name: {it: Dove ci si trova, en: Where we meet}
    place: Example
    latitude: 41.9006
    longitude: 12.5075
    text:
      it: "Da riempire: il giorno del mese, l'ora, a chi chiedere."
      en: "To fill in: the day of the month, the time, who to ask for."
# The shop page, the one the QR code on the sign opens. `wallet` is the page for whoever has no wallet yet; `stories`
# are the community's pages about a shop, under its external_id. `wallets` (same rules as `shop_form.wallets`, plus `methods`)
# and `first_bitcoin` are for the customer's pages, docs/features/customer-path.md: wallets to offer to whoever
# has none, and a page on a first bitcoin. A link is a page path after /<lang>/, as in `menu`,
# or a full https:// address. Texts and external_ids between quotes. Format and rules in docs/features/shop-page.md.
# shop_page:
#   wallet: about/
#   first_bitcoin: about/#first-bitcoin
#   wallets:
#     - name: Example Wallet
#       link: https://wallet.example.org/
#       platforms: [android, ios]
#       methods: [lightning, onchain]
#       description: {it: "Gratis, e le chiavi restano a te.", en: "Free, and the keys stay with you."}
#       open_source: true
#       self_custody: true
#       free: true
#   stories:
#     "12":
#       - path: about/#history
#         text: {it: "Qui è nata la comunità", en: "Where the community was born"}
# The new shop form: under the Lightning address, "Where do I find it?" links to `wallet`, the community's page on the
# wallets that work with the register (open source, non-custodial, free). Same kind of link as in `shop_page`.
# `wallets` are the wallets the step-by-step guide offers to a merchant who has none yet: name, link (a page or an
# https:// address), platforms (android, ios, windows, macos, linux, web) and a line of description. Only open source,
# non-custodial and free wallets, never an exchange: the community states it with the three `true`, and a wallet
# without them is not shown. Without `wallets` the guide links to `wallet`.
# shop_form:
#   wallet: about/#wallet
#   wallets:
#     - name: Example Wallet
#       link: https://wallet.example.org/
#       platforms: [android, ios]
#       description: {it: "Gratis, e le chiavi restano a te.", en: "Free, and the keys stay with you."}
#       open_source: true
#       self_custody: true
#       free: true
# The meetup board (docs/features/meetups.md): the next meetups and the last ones, kept in /admin/ and, if you like, read every
# day from the calendar events (NIP-52) that trusted Nostr authors publish. It turns on with the block and is off without it.
# The page is /<lang>/meetups/, the calendar /meetups.ics; in a page of the community write {% include "website/meetup_board.html" %}
# (all of it), {% meetup_board upcoming=3 past=3 level=3 %} (a short list) or {% meetup_next %} (one line).
# `link` stands in for the link of a meetup that has none; `past_months` is how far back the last ones go (1-36);
# `relays` are wss:// addresses (without them, the site's NOSTR_RELAYS); each `trusted` author needs a `note` on who certified it
# (the staff adds more in /admin/); with `cities` an event is kept only if it is near one of them, and the city is shown;
# `event_links: true` shows the link inside a Nostr event (off by default). Example values.
# meetups:
#   link: https://t.me/example
#   past_months: 12
#   relays: [wss://relay.example.org]
#   trusted:
#     - npub: npub1…
#       note: Certified by the staff on 2026-11-05
#   cities:
#     - {name: Example, latitude: 41.9022, longitude: 12.4970, radius_km: 15}
#   event_links: false
# The Nostr profile image; without it, the logo if it is not SVG
# nostr:
#   picture: /theme/logo.png
# OpenStreetMap, in both directions (docs/features/openstreetmap.md): off without this section. Once a month the site reads the
# elements of the area that carry bitcoin tags, proposes a link for the shops that are beyond doubt the same place (the
# association confirms it in /admin/), fills the address, town and position of the confirmed ones, offers their website and
# phone, and prepares the tags OpenStreetMap should have. It never writes there by itself: a person changes them by hand, or
# runs `manage.py osm_upload`, which asks first and is an experimental feature, off unless turned on (`experimental` above).
# `bbox` is south, west, north, east; the rest are the defaults or optional.
# osm:
#   bbox: [41.8, 12.4, 42.0, 12.6]
#   discount_tag: "currency:XBT:discount"
#   operator: {tag: "payment:bitcoin:operator", value: "operator.example"}
#   name_similarity: 0.85
#   distance_metres: 100
#   auto_link: true
#   comment: {en: "Update bitcoin payment tags"}
# Limits on how much the site keeps or how often a visitor can ask (docs/configuration.md#limits), so that an open site nobody
# watches every day does not fill up with spam or with data nobody asked for. All optional: what is not written has the default
# below. A whole number; 0 means no limit. At the limit the site refuses politely whatever would add one more, deletes nothing,
# writes it in the log, and says so in /admin/today/ (a warning from 80%) and in `manage.py preflight`.
# limits:
#   shops: 500                       # shops on the site (the demo shops do not count)
#   shops_waiting_wallet: 100        # shops saved without a wallet yet: sign-ups not finished
#   accounts: 2000                   # accounts of merchants and visitors who signed in (staff left out)
#   help_requests: 5000              # requests for help kept, solved ones too
#   nostr_meetups: 5000              # meetups copied from Nostr and kept
#   emails_per_month: 1000           # emails sent this month: the mail provider's quota (0 = no limit)
#   emails_per_day: 100              # emails sent today; if missing, a tenth of emails_per_month
#   emails_per_address_day: 5        # emails a visitor can make the site send to the same address in a day
#   emails_per_sender_day: 10        # emails one network address can make the site send in a day, whoever they are for
#   emails_staff_factor: 3           # times more emails per address and per network address for the staff and the allowed addresses
#   staff_registers_per_shop: 30     # staff registers turned on at the same time in one shop
#   accounts_per_address_hour: 20    # new accounts from one network address in an hour
#   shops_per_address_hour: 30       # new shops or wallets connected from one network address in an hour
#   help_requests_per_shop_day: 3    # requests for help from one shop in a day
