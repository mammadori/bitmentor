# The network is chosen only with NETWORK in the .env. Postgres stays on the internal network.
# Images are pinned by digest: to update, change version and digest together, after testing them.
# The project is the folder's name: Docker Compose names containers, networks and volumes after it, so two installations
# in folders with different names share nothing. No `name:` here, which would give every clone the same database.

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "${LOG_MAX_SIZE:-20m}", max-file: "${LOG_MAX_FILE:-5}"}

services:
  postgres:
    <<: *common
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    command: ["-c", "random_page_cost=1.0", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing: copy .env.example to .env and generate it with openssl rand -hex 32}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      WEB_DB_PASSWORD: "${WEB_DB_PASSWORD:?WEB_DB_PASSWORD is missing: copy .env.example to .env and generate it with openssl rand -hex 32}"
    volumes:
      - postgres_datadir:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/bitmentor.sh:ro
    # The others start when Postgres answers: on a first start it creates the site's database first, and they would fail
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    <<: *common
    build: .
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    # More than the 30 s of graceful_timeout (config/gunicorn.py): a request in flight finishes before the SIGKILL
    stop_grace_period: 35s
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is missing: generate it with openssl rand -hex 32, in the .env}"
      SITE_HOST: "${SITE_HOST:?SITE_HOST is missing: the name of the site, in the .env}"
      SITE_SCHEME: ${SITE_SCHEME:-https}
      ONION_LOCATION: ${ONION_LOCATION:-}
      SITE_MODE: ${SITE_MODE:-development}
      SITE_MODE_SINCE: ${SITE_MODE_SINCE:-}
      BITMENTOR_DEMO: ${BITMENTOR_DEMO:-}
      FAKE_EXPLORER: ${FAKE_EXPLORER:-}
      DEV_ALLOWED_IPS: ${DEV_ALLOWED_IPS:-127.0.0.1}
      TEAM_ACCESS: ${TEAM_ACCESS:-off}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/mammadori/bitmentor}
      NETWORK: ${NETWORK}
      POSTGRES_HOST: postgres
      POSTGRES_USER: bitmentor
      POSTGRES_PASSWORD: "${WEB_DB_PASSWORD:?WEB_DB_PASSWORD is missing: copy .env.example to .env and generate it with openssl rand -hex 32}"
      COMMUNITY_DIR: /community
      HSTS_SECONDS: ${HSTS_SECONDS:-86400}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      WEB_THREADS: ${WEB_THREADS:-8}
      LIGHTNING_CHANGE_DAYS: ${LIGHTNING_CHANGE_DAYS:-7}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API: ${TELEGRAM_API:-https://api.telegram.org}
      TELEGRAM_MODERATION_CHAT: ${TELEGRAM_MODERATION_CHAT:-}
      NOSTR_SECRET_KEY: ${NOSTR_SECRET_KEY:-}
      NOSTR_RELAYS: ${NOSTR_RELAYS:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}
    volumes:
      - ${COMMUNITY_DIR:-./examples/community}:/community:ro
    # web is healthy when it answers: 503 from /health/ is a problem already reported on its own (as in deploy/release.sh)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r, urllib.error as e\ntry: r.urlopen('http://localhost:8000/health/', timeout=5)\nexcept e.HTTPError as x: raise SystemExit(x.code != 503)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}

  # Optional: docker compose --profile tor up -d; the address: docker compose exec tor cat /var/lib/tor/site/hostname
  tor:
    <<: *common
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    profiles: [tor]
    entrypoint: ["sh", "/tor.sh"]
    # tor.sh starts as root to install tor and hand it its directory, then runs it as the `tor` user. What root keeps:
    # CHOWN for `chown -R tor` and apk's files, DAC_OVERRIDE and FOWNER to walk and chmod the tor-owned directory on
    # later starts, SETUID and SETGID for su. Not read_only: apk writes into the image at every start (tor.sh says why)
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    volumes:
      - ./tor.sh:/tor.sh:ro
      - tor_data:/var/lib/tor
    depends_on: [caddy]

  caddy:
    <<: *common
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    read_only: true
    tmpfs: [/config, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: "${SITE_HOST:?SITE_HOST is missing: the name of the site, in the .env}"
      SITE_MODE: ${SITE_MODE:-development}
      DEV_ALLOWED_IPS: ${DEV_ALLOWED_IPS:-127.0.0.1}
      TEAM_ACCESS: ${TEAM_ACCESS:-off}
      ADMIN_ALLOWED_IPS: "${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}"
      ACCESS_LOG: ${ACCESS_LOG:-off}
      ACCESS_LOG_KEEP: ${ACCESS_LOG_KEEP:-168h}
      LOG_IPV4_MASK: ${LOG_IPV4_MASK:-24}
      LOG_IPV6_MASK: ${LOG_IPV6_MASK:-48}
      OPEN_PATHS: ${OPEN_PATHS:-}
      SITE_SCHEME: ${SITE_SCHEME:-https}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      HSTS_SECONDS: ${HSTS_SECONDS:-86400}
      ONION_LOCATION: ${ONION_LOCATION:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/mode:ro
      - ${MAINTENANCE_DIR:-./maintenance}:/srv/maintenance:ro
      - ./caddy.d:/etc/caddy/local:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  tor_data:
  caddy_data:
  postgres_datadir:
