{% load i18n %}<form method="post" action="{% url 'first_day' shop.id %}" class="step-tick">{% csrf_token %}<input type="hidden" name="step" value="{{ step.key }}">{% if step.state == "done" %}<input type="hidden" name="done" value="0"><button class="linklike" aria-describedby="step-{{ shop.id }}-{{ step.key }}">{% translate "Untick" %}</button>{% else %}<input type="hidden" name="done" value="1"><button class="button button-quiet" aria-describedby="step-{{ shop.id }}-{{ step.key }}">{% translate "Mark as done" %}</button>{% endif %}</form>
