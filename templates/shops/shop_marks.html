{% load i18n %}{% if shop.certified %}<span class="certified"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>{% translate "Certified shop" %}</span>{% endif %}{% if shop.trained %}<span class="certified trained"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5 2v4c0 3-2.2 5.3-5 6.5C5.2 12.8 3 10.5 3 7.5v-4z"/></svg>{% translate "Trained merchant" %}</span>{% endif %}{% for mark in shop.marks %}<span class="paid paid-{{ mark.kind }} paid-{{ mark.band }}" role="img" aria-label="{{ mark.label }}" title="{{ mark.label }}">{% if mark.kind == "lightning" %}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 1 3 9.5h4.5L6.5 15 13 6.5H8.5z"/></svg>{% else %}<svg viewBox="0 0 16 16" aria-hidden="true"><path class="line" d="M6.5 9.5l3-3M7.5 4.5l1-1a2.6 2.6 0 0 1 3.7 3.7l-1 1M8.5 11.5l-1 1a2.6 2.6 0 0 1-3.7-3.7l1-1"/></svg>{% endif %}</span>{% endfor %}
