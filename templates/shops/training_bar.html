{% load i18n %}{% with bar=state.progress %}{% if bar %}<p class="training-bar"><label for="training-bar-value">{% if bar.goal == "base" %}{% blocktranslate with value=bar.value total=bar.max %}Towards the basic pass: {{ value }} of {{ total }} modules done{% endblocktranslate %}{% else %}{% blocktranslate with value=bar.value total=bar.max %}Towards the next badge: {{ value }} of {{ total }} steps done{% endblocktranslate %}{% endif %}</label>
  <progress id="training-bar-value" value="{{ bar.value }}" max="{{ bar.max }}">{{ bar.value }} / {{ bar.max }}</progress></p>{% endif %}{% endwith %}
