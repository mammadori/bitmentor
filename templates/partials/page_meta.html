{% if not indexable %}<meta name="robots" content="noindex, nofollow">
{% endif %}<link rel="canonical" href="{{ canonical }}">
{% for code, href in alternates %}<link rel="alternate" hreflang="{{ code }}" href="{{ href }}">
{% endfor %}<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:locale" content="{{ locale }}">
{% for other in other_locales %}<meta property="og:locale:alternate" content="{{ other }}">
{% endfor %}{% if image %}<meta property="og:image" content="{{ image.url }}">
{% if image.width %}<meta property="og:image:width" content="{{ image.width }}">
<meta property="og:image:height" content="{{ image.height }}">
{% endif %}<meta name="twitter:card" content="summary_large_image">
{% else %}<meta name="twitter:card" content="summary">
{% endif %}{% if structured %}<script type="application/ld+json">{{ structured }}</script>
{% endif %}
